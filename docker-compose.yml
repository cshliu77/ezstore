services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezstore
      POSTGRES_PASSWORD: ezstore
      POSTGRES_DB: ezstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cshliu77/ezstore/backend:latest
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ezstore
      DB_PASSWORD: ezstore
      DB_NAME: ezstore
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/cshliu77/ezstore/mcp-server:latest
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      # 讓本機執行的 Agent（agents-cli playground / run / eval）也能連到 MCP Server
      - "${MCP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started


  frontend:
    image: ghcr.io/cshliu77/ezstore/frontend:latest
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - mcp-server

  e2e:
    image: ghcr.io/cshliu77/ezstore/e2e:latest
    pull_policy: always
    environment:
      BASE_URL: http://frontend:80
      API_URL: http://backend:8080
    depends_on:
      - frontend
    profiles:
      - test

volumes:
  pgdata:
