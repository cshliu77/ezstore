services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezstore
      POSTGRES_PASSWORD: ezstore
      POSTGRES_DB: ezstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cshliu77/ezstore/backend:latest
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ezstore
      DB_PASSWORD: ezstore
      DB_NAME: ezstore
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/cshliu77/ezstore/mcp-server:latest
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - backend

  agent:
    image: ghcr.io/cshliu77/ezstore/agent:latest
    pull_policy: always
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MCP_URL: http://mcp-server:8000/mcp
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mcp-server

  frontend:
    image: ghcr.io/cshliu77/ezstore/frontend:latest
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - agent

  e2e:
    image: ghcr.io/cshliu77/ezstore/e2e:latest
    pull_policy: always
    environment:
      BASE_URL: http://frontend:80
      API_URL: http://backend:8080
    depends_on:
      - frontend
    profiles:
      - test

volumes:
  pgdata:
