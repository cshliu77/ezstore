[project]
name = "ezstore-mcp-server"
version = "0.2.0"
description = "MCP Server (Streamable HTTP) for EZStore quotation management"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
