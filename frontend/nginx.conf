server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /swagger/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    location /agent-api/ {
        # 用 Docker 內建 DNS 延遲解析 agent 主機名：agent 服務尚未建立時 nginx 仍可啟動，
        # 此時 /agent-api 會回 502，等 agent 容器起來後自動恢復。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_upstream http://agent:8080;
        rewrite ^/agent-api/(.*)$ /$1 break;
        proxy_pass $agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
